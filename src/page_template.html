<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Özkul Karar Sayısı · Özkul Decision Number</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --page-ink:#1C2430; --page-ink-2:#3A3F47; --page-muted:#6B727C; --page-line:#D5D8DC; --page-line-soft:#E9EBEE;
  --page-paper:#FFFFFF; --page-panel:#F5F6F7; --page-accept:#0F6E6E; --page-accept-soft:#E4F0F0;
  --page-reject:#B3261E; --page-reject-soft:#F7E6E4; --page-warn:#8A5A00; --page-warn-soft:#FBF1DD; --page-grey:#C9CDD2; --page-black:#2B2B2B;
  --page-sans:'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
  --page-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page-paper);color:var(--page-ink);font-family:var(--page-sans);font-size:15px;line-height:1.55}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
header{border-bottom:2px solid var(--page-ink)}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 0 12px}
.brand{font-weight:600;font-size:17px}
.brand small{font-weight:400;color:var(--page-muted);margin-left:8px;font-size:13px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lang button{font:inherit;font-size:13px;border:1px solid var(--page-ink);background:#fff;padding:4px 10px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--page-ink);color:#fff}
.lang button+button{border-left:0}
/* intro */
.intro{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:36px;padding:34px 0 30px;align-items:center}
@media(max-width:860px){.intro{grid-template-columns:1fr;gap:20px}}
.intro h1{font-size:clamp(26px,3.6vw,40px);line-height:1.15;margin:0 0 14px;letter-spacing:-.015em;font-weight:600}
.intro p{margin:0 0 10px;color:var(--page-ink-2);max-width:560px}
.facts3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:1px solid var(--page-ink);margin-top:18px}
.facts3 div{padding:10px 12px 0 0}
.facts3 b{display:block;font-family:var(--page-mono);font-size:22px}
.facts3 span{font-size:13px;color:var(--page-muted)}
.demo{border:1px solid var(--page-line);padding:18px}
.demo .cap{margin-bottom:0}
/* steps */
nav.steps{display:flex;border-bottom:1px solid var(--page-line);overflow-x:auto;margin-top:8px}
nav.steps button{font:inherit;background:none;border:0;border-bottom:3px solid transparent;padding:12px 18px 10px;color:var(--page-muted);cursor:pointer;white-space:nowrap;text-align:left}
nav.steps button b{display:block;color:inherit;font-size:15px}
nav.steps button span{font-size:12px}
nav.steps button[aria-selected=true]{color:var(--page-ink);border-bottom-color:var(--page-ink)}
nav.steps .no{font-family:var(--page-mono);margin-right:6px}
section.view{display:none;padding:24px 0 10px} section.view.on{display:block}
h2{font-size:21px;margin:0 0 6px;font-weight:600}
h3{font-size:15px;margin:26px 0 10px;font-weight:600}
p.lead{color:var(--page-ink-2);margin:0 0 18px;max-width:780px}
label{font-size:13px;color:var(--page-ink-2);display:block;margin-bottom:4px}
input,select,textarea{font:inherit;font-size:14px;color:var(--page-ink);background:#fff;border:1px solid var(--page-line);border-radius:3px;padding:7px 9px;min-width:0;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--page-ink);outline-offset:-1px}
input:disabled,select:disabled{background:var(--page-panel);color:var(--page-ink-2);border-color:var(--page-line-soft)}
input.num{font-family:var(--page-mono);text-align:right}
.grid{display:grid;gap:12px 16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:720px){.g2,.g3,.g4{grid-template-columns:1fr}}
.grid>div{min-width:0}
.card{border:1px solid var(--page-line);border-left:4px solid var(--page-ink);padding:16px 18px;margin:0 0 14px;background:#fff}
.card.bad{border-left-color:var(--page-reject)}
.card .head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.card .head b{font-size:15px}
.say{font-size:14px;margin-top:12px;padding:9px 12px;background:var(--page-panel);color:var(--page-ink)}
.say .tag{font-size:12px;color:var(--page-muted);display:block}
.err{color:var(--page-reject);font-size:13px;margin-top:8px}
.hint{font-size:12px;color:var(--page-muted);margin-top:3px}
details.adv{margin-top:10px} details.adv summary{cursor:pointer;font-size:13px;color:var(--page-ink-2)}
details.adv .grid{margin-top:10px}
.btn{font:inherit;font-weight:500;font-size:14px;border:1px solid var(--page-ink);background:#fff;color:var(--page-ink);border-radius:3px;padding:8px 16px;cursor:pointer;width:auto}
.btn:hover{background:var(--page-panel)} .btn.primary{background:var(--page-ink);color:#fff} .btn.primary:hover{background:#2E3846}
.btn.small{padding:4px 10px;font-size:13px} .btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0}
.policy{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(max-width:720px){.policy{grid-template-columns:1fr}}
.policy label.opt{display:block;border:1px solid var(--page-line);padding:12px 14px;cursor:pointer;margin:0;color:var(--page-ink)}
.policy label.opt.on{border-color:var(--page-ink);box-shadow:inset 3px 0 0 var(--page-ink)}
.policy input[type=radio]{width:auto;margin-right:8px}
.policy .d{display:block;font-size:13px;color:var(--page-muted);margin-top:4px}
.unitbox{margin-top:10px;background:#F5F8F8;border-left:4px solid var(--page-accept);padding:8px 12px;font-size:13.5px}.unitbox ul{margin:4px 0 0 18px;padding:0}
.exbanner{background:#EEF3F8;border:1px solid #C9D6E3;border-left:4px solid #3A6EA5;padding:10px 14px;margin:0 0 14px;font-size:14px}.exbanner b{display:block;margin-bottom:4px}
details.why{grid-column:1/-1;margin-top:10px}.why-box{padding:14px 18px}.why-box svg{max-width:900px}.why-text{font-size:14.5px;line-height:1.55;max-width:900px}
.chk{display:flex;align-items:center;gap:6px;font-weight:600}details.why{margin-top:6px}details.why summary{cursor:pointer;color:#3A6EA5;font-size:13.5px}
.sumbox{background:#fff;border:1px solid var(--page-line);padding:12px 16px;margin:0 0 16px}.sumbox table.sum td,.sumbox table.sum th{text-align:left!important;font-size:13.5px}
.lockbar{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--page-panel);border-left:4px solid var(--page-ink);margin:16px 0}
.lockbar.ok{border-left-color:var(--page-accept)} .lockbar.bad{border-left-color:var(--page-reject)}
.fp{font-family:var(--page-mono);font-size:12px;word-break:break-all;color:var(--page-ink-2)}
.acc{color:var(--page-accept)} .rej{color:var(--page-reject)} .mut{color:var(--page-muted)}
/* result */
.result{background:#fff;border:1px solid var(--page-ink);padding:16px 18px;margin-bottom:18px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 26px;align-items:center}
@media(max-width:900px){.result{grid-template-columns:1fr}}
.mini{grid-column:1/-1;border-top:1px solid var(--page-line);padding-top:10px}.mini svg{width:100%;max-width:900px;height:auto;display:block}
.restitle{grid-column:1/-1;border-bottom:1px solid var(--page-line);padding-bottom:8px;margin-bottom:2px}
.restitle b{font-size:16px}.restitle span{display:block;font-size:13px;color:var(--page-muted)}
.rev{grid-column:1/-1;border-top:1px solid var(--page-line);padding-top:10px;font-size:13.5px}
.rev .tag{display:inline-block;font-weight:600;padding:2px 8px;margin-top:6px}
.rev .s{background:var(--page-accept-soft);color:var(--page-accept)} .rev .m{background:var(--page-warn-soft);color:var(--page-warn)} .rev .b{background:var(--page-reject-soft);color:var(--page-reject)}
table.dt{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0}table.dt th,table.dt td{border-bottom:1px solid var(--page-line-soft);padding:4px 6px;text-align:left}table.dt td:last-child,table.dt th:last-child{text-align:right;font-family:var(--page-mono)}
.prox{grid-column:1/-1;border-top:1px solid var(--page-line);padding-top:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:4px 26px;font-size:13.5px}
.prox .ttl{grid-column:1/-1;font-weight:600}
.prox .hint{grid-column:1/-1}
.explain{background:#EEF3F8;border:1px solid #B9C9DA;border-radius:4px;padding:0 22px;margin:22px 0 26px}
.explain .intro{padding:20px 0 22px}
.explain .demo{background:#fff}
.app{border:2px solid var(--page-ink);border-radius:4px;padding:0 22px 18px;margin-bottom:10px;background:#fff}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:4px 12px;background:#B9C9DA;color:#1E3550;border-radius:0 0 4px 4px}
.app>.badge{background:var(--page-ink);color:#fff}
.science{background:#EEF3F8;border-top:1px solid #B9C9DA}
.chip{display:inline-block;font-family:var(--page-mono);font-size:12.5px;border:1px solid var(--page-line);padding:1px 8px;margin-top:6px;background:#fff;color:var(--page-ink)}
.sendbox{border:1px dashed var(--page-ink-2);padding:4px 18px 14px;margin:22px 0;background:var(--page-panel)}
ul.files{list-style:none;padding:0;margin:8px 0 0;font-size:13px} ul.files li{padding:3px 0}
.evlist{border-top:1px solid var(--page-line);margin:8px 0 16px}
.evlist .item{padding:10px 0;border-bottom:1px solid var(--page-line-soft);font-size:14px}
.decide{border:2px solid var(--page-ink);padding:6px 18px 16px;margin-top:18px}
.decide .opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0}
@media(max-width:720px){.decide .opts{grid-template-columns:1fr}}
.decide label.opt{border:1px solid var(--page-line);padding:10px 12px;cursor:pointer;margin:0;color:var(--page-ink)}
.decide label.opt.on{border-color:var(--page-ink);box-shadow:inset 3px 0 0 var(--page-ink)}
.decide input[type=radio]{width:auto;margin-right:8px}
.verdict{font-size:22px;font-weight:600;line-height:1.2}
.verdict.ACCEPT{color:var(--page-accept)} .verdict.REJECT{color:var(--page-reject)} .verdict.DISCRETION{color:var(--page-ink)} .verdict.NOT_APPROVABLE,.verdict.EMPTY{color:var(--page-ink-2)}
.why{font-size:14px;color:var(--page-ink-2);margin-top:4px}
.warn{background:var(--page-warn-soft);color:var(--page-warn);padding:8px 12px;font-size:13px;margin-top:8px}
.notation{display:grid;grid-template-columns:auto auto auto;align-items:center;gap:0 8px}
.notation .lt,.notation .lb,.notation .rt,.notation .rb{font-family:var(--page-mono);font-size:15px;line-height:1.1}
.notation .lt,.notation .rt{margin-bottom:16px} .notation .lb,.notation .rb{margin-top:16px}
.notation .lt,.notation .lb{text-align:right;color:var(--page-ink-2)}
.notation .H{grid-row:1 / span 2;grid-column:2;font-family:var(--page-mono);font-weight:600;font-size:52px;line-height:1}
.notation .lt{grid-row:1;grid-column:1;align-self:end} .notation .lb{grid-row:2;grid-column:1;align-self:start}
.notation .rt{grid-row:1;grid-column:3;align-self:end;color:var(--page-accept)} .notation .rb{grid-row:2;grid-column:3;align-self:start;color:var(--page-reject)}
.pc{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1.2fr);gap:14px;align-items:start}
@media(max-width:860px){.pc{grid-template-columns:1fr}}
.pc .inp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.meter{height:12px;background:var(--page-line-soft);position:relative;margin-top:8px}
.meter i{position:absolute;top:0;bottom:0}
.meter .mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--page-ink)}
.word{font-size:14px;margin-top:6px}
.chart{overflow-x:auto} .chart svg{display:block;max-width:100%;height:auto} .chart svg.tree{max-width:none}
.cap{font-size:12px;color:var(--page-muted);margin:4px 0 16px}
textarea.code{min-height:110px;font-family:var(--page-mono);font-size:12px}
.check{list-style:none;padding:0;margin:12px 0}
.check li{padding:9px 0;border-bottom:1px solid var(--page-line-soft);display:flex;gap:12px}
.check b{font-family:var(--page-mono);width:52px;flex:none}
.bigverdict{font-size:20px;font-weight:600;margin:14px 0 4px}
/* science */
.science{border-top:2px solid var(--page-ink);margin-top:40px;padding:26px 0 40px;background:#fff}
.science h2{margin-bottom:4px}
.sci{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 40px}
@media(max-width:860px){.sci{grid-template-columns:1fr}}
.sci h3{margin:22px 0 6px}
.sci p{margin:0 0 8px;font-size:14px;color:var(--page-ink-2)}
.f{font-family:var(--page-mono);font-size:13.5px;background:var(--page-panel);padding:8px 12px;margin:6px 0 10px;overflow-x:auto;white-space:nowrap;color:var(--page-ink)}
footer{border-top:1px solid var(--page-line);color:var(--page-muted);font-size:12px;padding:14px 0 26px}
.sr{position:absolute;left:-9999px}
</style>
</head>

<script>
(function(){
const $ = s => document.querySelector(s);
const esc = s => String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = HN.num;
let LANG = 'tr'; try { LANG = sessionStorage.getItem('odn.lang') || 'tr'; } catch(e){}
const fmt = v => { const s = HN.fmt(v); return LANG==='tr' ? s.replace('.', ',') : s; };
const nf = v => v===null||v===undefined||v==='' ? '' : (LANG==='tr' ? String(v).replace('.', ',') : String(v));
const pn = v => { if (v===null||v===undefined) return v; const s = String(v).trim().replace(/\s/g,''); return s.indexOf(',')>=0 && s.indexOf('.')<0 ? s.replace(',', '.') : s.replace(/,/g,''); };

// ---------------- texts ----------------
const T = {
tr:{
 brand:'Özkul Karar Sayısı', brandSmall:'şartname uygunluğunu tek sayıyla göster',
 iTitle:'Bir işin şartnameye uyup uymadığını tek bir sayı söyler.',
 iP1:'Şartnamedeki her koşul aynı cetvele çevrilir. Sonuç, en zayıf koşulun puanıdır. Çünkü zincir en zayıf halkası kadar sağlamdır: bir koşuldaki fazlalık, başka bir koşuldaki eksikliği kapatamaz.',
 iP2:'<b>Dört adımda yöntem:</b> (1) Her koşul için üç değer yazılır: kabul edilemez (−1), sınır (0), yeterli (+1). (2) Bulunan değer, belirsizliği kadar sınıra doğru kaydırılıp bu cetvelde puanlanır. (3) Zorunlu bir koşul sınırı aşarsa sonuç eksidir; aşmıyorsa artıdır. Büyüklüğü en zayıf zorunlu koşul ile bütün koşulların önem ağırlıklı ortalaması belirler. (4) Şartname sahibinin eşikleri kabul, ret ya da kendi kararını belirler.<br><br>Şartnameyi yazan kişi kuralları kilitler. İşi yapan kişi yalnızca bulduğu değerleri girer ve sonucu hemen görür. Hakem ya da onaylayan kişi aynı hesabı tek tıkla tekrar yapabilir.',
 iF1:'tam puan, bundan iyisi fark etmez', iF2:'tam sınırda', iF3:'kesinlikle kabul edilemez', iUse:'<b>Nerelerde kullanılır?</b> Satın alma ve ihaleler · inşaat ve kontrol raporları · üretimde kalite kontrol · yazılım ve yapay zekâ modeli yayına alma · yatırım ve risk limitleri · ödev ve proje değerlendirme · ikinci el araç veya batarya alımı. Kural her yerde aynı: zorunlu bir koşul sağlanmazsa sonuç eksidir.', iSign:'<b>Neden eksi var?</b> İşaret “şartnameye uyuyor mu?” sorusunu, büyüklük “ne kadar?” sorusunu cevaplar. Artı ise bütün sınırlar sağlanmıştır ve sayı payın ne kadar olduğunu söyler. Eksi ise en az bir sınır aşılmıştır ve sayı aşımın ne kadar ciddi olduğunu söyler. −0,05 küçük bir düzeltmeyle ya da sapma onayıyla kurtarılabilecek bir iştir, −0,80 baştan ele alınması gereken bir iştir. 0–1 arası bir ölçekte sınır her şartnamede başka bir noktada kalırdı ve bu fark görünmezdi.',
 iDemoCap:'<b>Örnek: bir kirişin dört koşulu</b><table class="dt"><tr><th>Koşul</th><th>Tür</th><th>Sınır</th><th>Bulunan</th><th>Puan</th></tr><tr><td>Sehim</td><td>zorunlu</td><td>≤ 10 mm</td><td>8 mm</td><td class="acc">+0,40</td></tr><tr><td>Güvenlik katsayısı</td><td>zorunlu · Dayanım</td><td>≥ 1,5</td><td>1,80</td><td class="acc">+0,60</td></tr><tr><td>Gerilme</td><td>zorunlu · Dayanım</td><td>≤ 200 MPa</td><td>180 MPa</td><td class="acc">+0,40</td></tr><tr><td>Maliyet</td><td>puan düşürür</td><td>≤ 100 bin USD</td><td>120 bin USD</td><td class="rej">−0,40</td></tr></table><b>1. İşaret.</b> Bütün zorunlu koşullar sınır içinde, en zayıfı +0,40. Bu yüzden iş reddedilmez. Maliyet sınırı aşıyor, ama bu koşulun türü “puan düşürür”.<br><b>2. Büyüklük</b> (β = 0,5, eşit önem; gerilme ile güvenlik katsayısı aynı “Dayanım” grubunda olduğu için bir kez sayılır):<br>taban 0,5 × (+0,40) = +0,20 · sehim +0,07 · Dayanım +0,07 · maliyet −0,07 → <b>A = +0,26</b> (yuvarlama aşağı).<br><b>3. Karar.</b> A = +0,26 ve en zayıf zorunlu koşul m = +0,40, otomatik kabul eşiği +0,20’nin üstünde: <b>kabul</b>. Maliyet 100 bin USD’ye inerse A = +0,33, 70 bin USD’ye inerse +0,50 olur. Maliyet zorunlu olsaydı A = −0,38 olur ve iş reddedilirdi.',

en:{
 brand:'Özkul Decision Number', brandSmall:'specification compliance in one number',
 iTitle:'One number tells you whether a piece of work meets its specification.',
 iP1:'Every requirement is put on the same ruler, and the result is the score of the weakest requirement. A chain is only as strong as its weakest link, so a surplus on one requirement can never cover a shortfall on another.',
 iP2:'<b>The method in four steps:</b> (1) For each requirement write three values: unacceptable (−1), limit (0), good enough (+1). (2) Each value found is moved towards the limit by its uncertainty and scored on this ruler. (3) If a mandatory requirement fails, the result is negative; otherwise positive. Its size combines the weakest mandatory score with the importance-weighted average of all scores. (4) The owner’s thresholds decide: accept, reject or the owner’s own judgement.<br><br>The specification owner writes the rules and locks them. The person doing the work only enters the values found and sees the result at once. A reviewer or approver can repeat the whole calculation with one click.',
 iF1:'full score; better makes no difference', iF2:'exactly at the limit', iF3:'unacceptable', iUse:'<b>Where can it be used?</b> Purchasing and tenders · construction and inspection reports · manufacturing quality control · software and AI release gates · investment and risk limits · coursework and project grading · buying a used car or battery. The rule is the same everywhere: if a mandatory requirement is not met, the result is negative.', iSign:'<b>Why a minus side?</b> The sign answers “does it meet the specification?”, the size answers “by how much?”. Plus means every limit is met and the number is the margin. Minus means at least one limit is exceeded and the number is the depth of the violation. −0.05 can be rescued by a small fix or a concession; −0.80 needs to be rethought. On a 0–1 scale the limit would sit at a different point in every specification and this difference would be hidden.',
 iDemoCap:'<b>Example: four requirements of a beam</b><table class="dt"><tr><th>Requirement</th><th>Type</th><th>Limit</th><th>Found</th><th>Score</th></tr><tr><td>Deflection</td><td>mandatory</td><td>≤ 10 mm</td><td>8 mm</td><td class="acc">+0.40</td></tr><tr><td>Safety factor</td><td>mandatory · Strength</td><td>≥ 1.5</td><td>1.80</td><td class="acc">+0.60</td></tr><tr><td>Stress</td><td>mandatory · Strength</td><td>≤ 200 MPa</td><td>180 MPa</td><td class="acc">+0.40</td></tr><tr><td>Cost</td><td>penalising</td><td>≤ 100 kUSD</td><td>120 kUSD</td><td class="rej">−0.40</td></tr></table><b>1. Sign.</b> All mandatory requirements are within their limits; the weakest is +0.40, so the work is not rejected. Cost exceeds its limit, but its type is “penalising”.<br><b>2. Size</b> (β = 0.5, equal importance; stress and safety factor are in one “Strength” group and count once):<br>base 0.5 × (+0.40) = +0.20 · deflection +0.07 · Strength +0.07 · cost −0.07 → <b>A = +0.26</b> (rounded down).<br><b>3. Decision.</b> A = +0.26 and the weakest mandatory requirement m = +0.40 are above the automatic-acceptance threshold +0.20: <b>accepted</b>. Cost at 100 kUSD gives A = +0.33, at 70 kUSD +0.50. Had cost been mandatory, A = −0.38 and the work would be rejected.',

 upLh:'Enter a number: the smallest acceptable value (e.g. 1.5 for a safety factor). This value scores 0.', upBh:'Enter a number: anything above it is not better; it scores full (+1) (e.g. 2.0).', upSh:'Enter a number: the value at which the work is unacceptable whatever else (e.g. safety factor 1.0). This value or lower scores −1. Must be below the lower limit. See the picture below for what it does.', dnLh:'Enter a number: the largest allowed value (e.g. 10 mm deflection). This value scores 0.', dnBh:'Enter a number: anything below it is not better; it scores full (+1) (e.g. 5 mm).', dnSh:'Enter a number: the value at which the work is unacceptable whatever else (e.g. deflection 15 mm). This value or higher scores −1. Must be above the upper limit. See the picture below for what it does.', upL:'Lower limit (at least)', upB:'Full-score value (higher is not better)', upS:'Unacceptable value (optional)',

 advanced:'Details (optional)', groupH:'Optional. Collects requirements under headings (e.g. Structural, Dynamic, Cost). It does not change the calculation; it only draws a tree showing each group’s weakest requirement (see example 9, aircraft wing).', u0H:'Optional. The value used when the contractor enters no uncertainty, in the requirement’s own unit (e.g. ±0.01 mm). The value is moved towards the limit by this amount before scoring. Leave empty (0) if unknown.', scaleH:'Linear: right for most requirements. Logarithmic: for values that vary over a very wide range where ratios matter (e.g. fatigue life 60 000–300 000 cycles; going from 100 000 to 200 000 is worth more than from 200 000 to 300 000).', defnH:'Optional but recommended. Write how the requirement is measured (e.g. “micrometer at 3 points, largest value taken”). Contractor and reviewer then measure the same thing; it is part of the lock code.', group:'Group (e.g. Structural, Cost)', u0:'Default measurement uncertainty (±)', vmin:'Smallest valid value', vmax:'Largest valid value', mand:'Mandatory', defn:'Definition and measurement method', scale:'Scale', lin:'Linear', log:'Logarithmic (ratios matter, very wide range)',
 resTitle:'Özkul Decision Number (A) · the main result to look at', resSub:'Only mandatory requirements set the sign: minus means at least one mandatory limit is exceeded; no other requirement can flip it. The size tells how close the work is to acceptance. Every requirement appears in the contribution bar.',
 Ylab:'Closeness to acceptance (Y)', Ydef:'Y = average of all requirement scores. It is not part of the decision; it shows how good the work is as a whole.', Amark:'A (decision)', decFloor:'Floor rule: mandatory limits are met, so A does not go below zero',  sAutoH:'May be left empty: the system uses an automatic value (grey text). At and beyond this value the score is −1. See the explanation below for what it does.', autoPh:'automatic: {0}', auto:'automatic', read_auto:'(Unacceptable value automatic.)', sfVeto:'<b>What happens at −1?</b> If a mandatory requirement reaches its unacceptable value, A becomes −1 directly (veto). This is the lowest score, but the final disposition still depends on τrej and the selected inclusive/exclusive boundary rule. If τrej = −1 with an exclusive boundary (E), −1 does not satisfy the automatic-rejection condition; unless another automatic rule applies, the owner decides.',  sfOk:'complies', sfBad:'limit exceeded', sfS1:'−1 point', sfFlat:'beyond this always −1', hardWhy:'How is the score computed beyond the limit? (explanation)', sfS:'unacceptable (−1)', sfL:'limit (0)', sfB:'full score (+1)', sfT:'What do these three values do?', sfIntro:'Once the three values are entered, a picture appears here showing what the “unacceptable value” does.', sfTxt:'<b>How is the score computed?</b> At the full-score value ({0}) the score is +1, at the limit ({1}) it is 0, and values in between score in proportion to their distance. Beyond the limit the score turns negative and reaches −1 at the unacceptable value ({4}). E.g. {2} → −0.10 (slight), {3} → −0.50 (half way). Beyond the unacceptable value it stays −1 however bad, just as anything better than the full-score value stays +1. So an excess that grows without bound causes no problem.<br><b>Do I have to enter the unacceptable value?</b> No. If left empty, the system places it on the other side of the limit at the same distance as the full-score value ({5}). If you enter another value (e.g. cost may still be negotiated even 50 % over budget), that value is used.<br><b>What is the negative score for?</b> A mandatory requirement exceeding its limit makes A negative; automatic rejection additionally depends on the configured τrej threshold and inclusive/exclusive boundary rule. If τrej < 0, a negative result above that threshold may only be considered as a documented exception. The size of the negative score indicates the severity of the violation: the “correction needed” section proposes a minor, moderate or major correction from it. For a penalising requirement the negative score sets how much it lowers the result: cost slightly over budget lowers it a little, far over budget a lot.',  clearQ:'All requirements and values will be deleted and an empty specification opened. What you entered in this session cannot be recovered. Continue?', clearH:'Clear all values to write your own specification. What you enter is kept only for this session.',  oneSlope:'If the limit is exceeded the score goes negative: an excess equal to the distance from limit to full score means −1. E.g. limit 10, full score 5: 15 → −1. No separate “unacceptable value” is needed.',  triLeg:'Penalising requirement over its limit: check it',  tipScore:'score', tipVal:'Value evaluated: {0}', tipIdeal:'Ideal (full-score) value {0}; deviation: {1}', tipLim:'Limit {0}; relative to limit: {1}', tipWarn:'⚠ A penalising requirement exceeds its limit. It cannot reject the work alone, but it should be checked.', tipSoft:'Penalising requirement: cannot reject the work, only affects the result.', swT:'Should be checked:', swIdeal:'deviation from ideal', swTxt:'A penalising requirement exceeds its limit. The result is still positive because this requirement alone is not a reason for rejection, but the deviation should be looked at before acceptance. Hover over the orange exclamation mark on the scale for details.',  toVer:'Go to review (step 3) →', toVerH:'The specification owner reviews the result and evidence notes in step 3 and confirms the decision.', verSum:'Result under review', verIncomplete:'{0} decision-relevant requirement value(s) missing (mandatory or penalising). An incomplete review cannot be approved; complete them in step 2.', decSession:'This decision is kept only for this session. For a permanent record take a screenshot or note the decision code.',  betaEx:'Example (beam): weakest mandatory requirement +0.40; average of the other requirements +0.13 (low because cost exceeds its limit). With None, A = +0.40. With Balanced, A = 0.5 × 0.40 + 0.5 × 0.13 = +0.26. So “Balanced” lets the other requirements, good or bad, show in the result. Each requirement’s share in that average is set by “Importance” on its card.',  kExpl:'k is how many times the uncertainty the value is moved towards the limit; it is a multiplier, not a probability. k = 0 means no shift (uncertainty ignored). k = 1 and k = 2 are the usual factors in metrology (GUM). Because the uncertainty is given as ± and only the side towards the limit matters, k = 1 is about 84 % and k = 2 about 98 % on the safe side (for a two-sided interval k = 2 is about 95 %, which is why “95 %” is usually quoted).', impH2:'What does importance do? It only affects the size of the result: it sets this requirement’s share in the average of the other requirements (e.g. High 0.75, Medium 0.50). It does not affect whether the work is rejected; the requirement type does. If “effect of the other requirements” is None (β = 0), or only one requirement counts, importance has no effect and the choice is disabled.', impOff:'No effect: β = 0 or a single requirement', twNomH:'Ideal value and tolerance: enter the ideal (nominal) value and the allowed lower / upper limit. The score is proportional to how close the value is to the ideal: +1 (full score) at the ideal, 0 (compliant, lowest score) at a tolerance limit, and in proportion to the distance in between. E.g. ideal 25.00, limits 24.80 / 25.20: 25.00 → +1, 24.90 → +0.50, 24.80 → 0. Any value outside the tolerance is non-compliant; whether it is automatically rejected depends on A, τrej and the selected inclusive/exclusive boundary rule. If the ideal may be approached from one side only, set that side’s limit equal to the ideal (e.g. 25.00 / 25.20: below 25 is not accepted).', numNeed:'Enter a number',  dotTip:'this requirement’s own score. A is computed from these scores; for automatic acceptance the leftmost mandatory dot must also pass the threshold', dotLeg:'Each dot is one requirement’s score (hover to see its name)', exNow:'Example being examined',  nominal:'nominal', sumAcc:'For automatic acceptance (own unit)', ruleBool:'Decision rule: yes/no question. PASS if every answer is yes, FAIL if any is no. There are no intermediate values or thresholds.', ruleTxt:'Decision rule: when τacc is specified, automatic acceptance requires both A and the weakest mandatory score to meet τacc under the selected inclusive/exclusive boundary rule. When τrej is specified, A is automatically rejected when it meets that rejection threshold under its selected boundary rule. Otherwise the owner decides. A negative value indicates at least one mandatory-limit violation; it does not by itself determine the final disposition.', ruleTxtC:'Decision rule: when τacc is specified, automatic acceptance requires both A and the weakest mandatory score to meet τacc under the selected inclusive/exclusive boundary rule. When τrej < 0, negative results that do not meet the rejection threshold are not automatically rejected; the owner may consider them only as documented exceptions. In other cases, the disposition follows the configured τrej threshold and boundary rule or remains with the owner.', boolSub:'Yes/no question: the result can only be +1 (pass) or −1 (fail).', V_PASS:'PASS', V_FAIL:'FAIL', boolOk:'All answers are correct / yes.', boolNo:'At least one answer is wrong / no.', boolNote:'Yes/no questions have no intermediate values, so the scale, thresholds  simT:'Before locking: bad scenarios', simLead:'This table shows, before locking, what the decision would be if each penalising requirement turned out badly. −0.25, −0.50 and −1 are not percentages or units: they are the requirement’s score on the common ruler. 0 = at the limit, −1 = the “unacceptable” value you entered. So −0.25 means a quarter of the way from the limit to the unacceptable value; each row shows what this is in the requirement’s own unit (e.g. kUSD). For the other requirements two situations are assumed: “good” (each +0.40) and “at the limit” (each +0.05). The system builds the scenarios itself; there is no parameter to choose. The table appears automatically for every requirement you set as penalising. Your decision is whether these outcomes are acceptable. If not, make the requirement mandatory or change its importance or the “effect of the other requirements”; if yes, tick the box.', simCols:'Requirement|Case (score)|In its own unit|Others good (+0.40)|Others at limit (+0.05)',

 pTol:'Allow conditional acceptance (concession)', pTolD:'Work that exceeds a limit only slightly is not rejected automatically; it is left to you (e.g. a small dimensional error that does not affect use). You may reject it, have it reworked, or accept it conditionally with a written justification. The reject threshold sets how much is “slight”: −0.10 means 10 % of the way from the limit to the unacceptable value.',

// ---------------- plain-language helpers ----------------
const U = p => p.unit ? ' '+p.unit : '';
function readback(p){
  const has = (...k) => k.every(f => num(p[f])!==null), v = f => nf(p[f])+U(p);
  if (p.type==='bool') return t('read_bool');
  const lg = p.scale==='log' ? t('read_log') : '';
  if (p.type==='two' && has('Slo','Llo','Blo','Bhi','Lhi','Shi') && +p.Blo===+p.Bhi) return t('read_nom', v('Blo'), v('Llo'), v('Lhi'))+lg;
  if (p.type==='two') return has('Slo','Llo','Blo','Bhi','Lhi','Shi') ? t('read_two', v('Llo'), v('Lhi'), nf(p.Blo), v('Bhi'), v('Slo'), v('Shi'))+t(p.inclLo==='E'?'rdE':'rdI', v('Llo'))+t(p.inclHi==='E'?'rdE':'rdI', v('Lhi'))+lg : t('read_inc');
  if (!has('S','L','B')) return t('read_inc');
  return (p.dir==='down' ? t('read_dn', v('L'), v('B'), v('S')) : t('read_up', v('L'), v('B'), v('S')))+(p.Sset?'':' '+t('read_auto'))+t(p.incl==='E'?'rdE':'rdI', v('L'))+lg;
}
function paramErrors(p){
  const e = [], n = f => num(p[f]);
  if (!p.name) e.push(t('e_name'));
  if (p.type==='one') {
    const S=n('S'), L=n('L'), B=n('B');
    if ([S,L,B].some(x => x===null)) e.push(t('e_need'));
    else if (p.dir==='down' ? !(S>L && L>B) : !(S<L && L<B)) e.push(t(p.dir==='down'?'e_dn':'e_up'));
    if (p.scale==='log' && [S,L,B].some(x => x!==null && x<=0)) e.push(t('e_log'));
    if (S!==null&&L!==null&&B!==null && num(p.u0)!==null && +p.u0 >= Math.abs(B-L)) e.push(t('e_u0big'));
  } else if (p.type==='two') {
    const T = num(p.T)!==null ? n('T') : n('Blo'), lo = n('Llo'), hi = n('Lhi');
    if ([T,lo,hi].some(x => x===null)) e.push(t('e_need6'));
    else if (!(lo<=T && T<=hi && lo<hi)) e.push(t('e_two'));
    if (p.scale==='log' && [T,lo,hi].some(x => x!==null && x<=0)) e.push(t('e_log'));
  }
  return e;
}
function specErrors(){
  const e = []; if (!spec.params.length) e.push(t('e_none'));
  spec.params.forEach((p,i) => paramErrors(p).forEach(m => e.push((p.name||t('param')+' '+(i+1))+': '+m)));
  const a = num(spec.tauA), r = num(spec.tauR);
  if (a!==null && (a<0 || a>1)) e.push(t('e_tauA'));
  if (r!==null && (r<-1 || r>1)) e.push(t('e_tauR'));
  if (!e.length) HN.validateSpec(engineSpec(spec)).forEach(m => e.push(m));
  return e;
}
function word(x){
  if (x.status==='missing') return '<span class="mut">'+t('w_miss')+'</span>';
  if (x.status==='invalid') { const k = /range/.test(x.reason)?'inv_range':/negative/.test(x.reason)?'inv_neg':'inv_log'; return '<span class="rej">'+t('w_inv', t(k))+'</span>'; }
  const d = x.d;
  if (x.atLimitExcluded) return '<span class="rej">'+t('w_excl')+'</span>';
  if (d>=1) return '<span class="acc">'+t('w_full')+'</span>';
  if (d>0) return '<span class="acc">'+t('w_ok', Math.round(d*100))+'</span>';
  if (d===0) return '<span>'+t('w_zero')+'</span>';
  if (d<=-1) return '<span class="rej">'+t('w_black')+'</span>';
  return '<span class="rej">'+t('w_bad', Math.round(-d*100))+'</span>';
}
function autoS(p){ const L = num(p.L), B = num(p.B); if (L===null || B===null || L===B) return null; if (p.scale==='log' && L>0 && B>0) return +(L*L/B).toPrecision(6); return +(L - (B - L)).toFixed(6); }
function syncOne(p){ if (p.type!=='one') return; const L = num(p.L), B = num(p.B); if (L===null || B===null || L===B) return; p.dir = B > L ? 'up' : 'down'; if (!p.Sset) p.S = autoS(p); }
function slopeFig(p){
  const S = num(p.S), L = num(p.L), B = num(p.B); if ([S,L,B].some(v => v===null) || paramErrors(p).length) return '<div class="explain">'+t('sfIntro')+'</div>';
  const up = B > L, ext = L + (L - B) * 0.6, xs = [B + (B - L) * 0.35, B, L, S, S + (S - L) * 0.45];
  const lo = Math.min(...xs), hi = Math.max(...xs), Wd = 900, Hd = 260, x0 = 70, x1 = 870, X = v => up ? x1 - (v-lo)/(hi-lo)*(x1-x0) : x0 + (v-lo)/(hi-lo)*(x1-x0), Y = d => 30 + (1-d)/2*150, u = p.unit ? ' '+esc(p.unit) : '';
  const sc = v => { const q = Object.assign({}, p, {u0:0, hard:false}); const r = HN.scoreParam(q, {value:v, u:0}, 0); return r.status==='ok' ? r.d : null; };
  let path = ''; for (let k = 0; k <= 160; k++) { const v = lo + (hi-lo)*k/160, d = sc(v); if (d===null) continue; path += (path?' L':'M')+X(v).toFixed(1)+' '+Y(d).toFixed(1); }
  let g = '<svg viewBox="0 0 '+Wd+' '+Hd+'" width="100%" role="img" aria-label="score">';
  g += '<rect x="'+Math.min(X(L),X(xs[4]))+'" y="30" width="'+Math.abs(X(xs[4])-X(L))+'" height="150" fill="#FBEAEA"/><rect x="'+Math.min(X(L),X(xs[0]))+'" y="30" width="'+Math.abs(X(xs[0])-X(L))+'" height="150" fill="#E8F3F3"/>';
  g += '<text x="'+((X(L)+X(xs[0]))/2)+'" y="168" font-size="15" font-weight="700" text-anchor="middle" fill="'+C.acc+'">'+esc(t('sfOk'))+'</text><text x="'+((X(L)+X(xs[4]))/2)+'" y="48" font-size="15" font-weight="700" text-anchor="middle" fill="'+C.rej+'">'+esc(t('sfBad'))+'</text>';
  [1,0,-1].forEach(d => { g += '<line x1="'+x0+'" x2="'+x1+'" y1="'+Y(d)+'" y2="'+Y(d)+'" stroke="'+(d===0?C.ink:C.line)+'" stroke-width="'+(d===0?1.2:.8)+'"/><text x="'+(x0-10)+'" y="'+(Y(d)+5)+'" font-size="14" text-anchor="end" fill="'+C.muted+'" font-family="'+MONO+'">'+fmt(d)+'</text>'; });
  g += '<path d="'+path+'" fill="none" stroke="'+C.ink+'" stroke-width="3"/>';
  const mark = (v, d, col, lab) => { g += '<circle cx="'+X(v)+'" cy="'+Y(d)+'" r="6" fill="'+col+'"/><line x1="'+X(v)+'" x2="'+X(v)+'" y1="'+Y(d)+'" y2="198" stroke="'+col+'" stroke-dasharray="4 3"/><text x="'+X(v)+'" y="218" font-size="14" font-weight="700" text-anchor="middle" fill="'+col+'">'+esc(lab)+'</text><text x="'+X(v)+'" y="238" font-size="14" text-anchor="middle" fill="'+C.ink+'" font-family="'+MONO+'">'+nf(+v.toFixed(4))+u+'</text>'; };
  mark(B, 1, C.acc, t('sfB')); mark(L, 0, C.ink, t('sfL')); mark(S, -1, C.rej, t('sfS'));
  g += '<text x="'+X(xs[4])+'" y="'+(Y(-1)-10)+'" font-size="13" text-anchor="'+(up?'start':'end')+'" fill="'+C.rej+'">'+esc(t('sfFlat'))+'</text>';
  g += '</svg>';
  const half = L + (S - L)/2, q1 = L + (S - L)*0.1;
  return '<div class="explain why-box"><div class="chart">'+g+'</div><div class="why-text">'+t('sfTxt', nf(B)+u, nf(L)+u, nf(+q1.toFixed(4))+u, nf(+half.toFixed(4))+u, nf(S)+u, nf(+Math.abs(L-B).toFixed(4))+u)+'</div><div class="why-text" style="margin-top:8px">'+t('sfVeto')+'</div></div>';
}
function syncTwo(p){
  if (p.type!=='two') return;
  const T = num(p.T), lo = num(p.Llo), hi = num(p.Lhi); if (T===null || lo===null || hi===null) return;
  const w = Math.max(T-lo, hi-T) || 1;
  p.appr = 'both'; p.fb = 0; p.Blo = T; p.Bhi = T;
  p.Slo = +(lo - w).toFixed(6); p.Shi = +(hi + w).toFixed(6);
}
function twoPreview(p){
  if (paramErrors(p).length) return '';
  const lo=+p.Llo, hi=+p.Lhi, n=8, pts=[];
  for (let k=0;k<=n;k++) pts.push(lo + (hi-lo)*k/n);
  const sc = x => { const q = Object.assign({}, p, {u0:0}); const r = HN.scoreParam(q, {value:x, u:0}, 0); return r.status==='ok' ? r.d : null; };
  return '<div class="hint" style="margin-top:8px"><b>'+t('twPrev')+'</b></div><div class="chart"><table class="dt" style="width:auto"><tr><th>'+esc(p.unit||'')+'</th>'+pts.map(x => '<th class="mono">'+nf(+x.toFixed(4))+'</th>').join('')+'</tr><tr><th>'+t('score')+'</th>'+pts.map(x => { const d = sc(x); return '<td class="mono '+(d!==null&&d<0?'rej':'acc')+'">'+(d===null?'–':fmt(d))+'</td>'; }).join('')+'</tr></table></div>';
}
function inclExample(p, f, sgn){
  const L = num(p[f]); if (L===null) return '';
  const dec = Math.max(2, ...['S','L','B','Slo','Llo','Blo','Bhi','Lhi','Shi'].map(k => { const v = p[k]; if (v===null||v===undefined||v==='') return 0; const q = String(v).split('.'); return q[1]?q[1].length:0; }));
  const step = Math.pow(10, -Math.max(dec, 0)) * (dec===0 ? 1 : 1);
  const next = +(L + sgn*step).toFixed(Math.max(dec,0));
  const inc = f==='L' ? p.incl : (f==='Llo' ? p.inclLo : p.inclHi);
  return '<b>'+(inc==='E'?t('inclE').split(':')[0]:t('inclI').split(':')[0])+'</b> · '+t('inclEx', nf(L)+U(p), t('w_zero').toLowerCase(), nf(next)+U(p));
}
function meter(d){
  if (d===undefined || d===null) return '<div class="meter"><span class="mid"></span></div>';
  const w = Math.abs(d)*50, l = d>=0 ? 50 : 50-w;
  return '<div class="meter"><i style="left:'+l+'%;width:'+w+'%;background:'+(d<0?'var(--page-reject)':'var(--page-accept)')+'"></i><span class="mid"></span></div>';
}

  h += '<h3>'+t('wT')+'</h3><p class="lead">'+t('wLead')+'</p>'+

  const gval = g => { const v = groups[g].filter(x => x.status==='ok').map(x => x.d); return v.length ? Math.min.apply(null, v) : null; };
  const node = (x, y, name, v, bold) => '<rect x="'+(x-bw/2)+'" y="'+y+'" width="'+bw+'" height="38" rx="3" fill="#fff" stroke="'+(bold?C.ink:C.line)+'" stroke-width="'+(bold?2:1)+'"/><text x="'+x+'" y="'+(y+15)+'" font-size="10.5" text-anchor="middle" fill="'+C.muted+'">'+esc(short(name,19))+'</text><text x="'+x+'" y="'+(y+31)+'" font-size="12" font-weight="600" text-anchor="middle" fill="'+(v===null?C.muted:v<0?C.rej:C.acc)+'" font-family="'+MONO+'">'+(v===null?'–':fmt(v))+'</text>';
  let s = '<svg class="tree" viewBox="0 0 '+W+' '+Ht+'" width="'+W+'" role="img" aria-label="tree">', i = 0; const gx = {};
  gn.forEach(g => { const n = groups[g].length; gx[g] = (lx(i)+lx(i+n-1))/2; i += n; });
  gn.forEach(g => { const b = root!==null && gval(g)===root; s += '<line x1="'+W/2+'" y1="46" x2="'+gx[g]+'" y2="94" stroke="'+(b?C.ink:C.line)+'" stroke-width="'+(b?2:1)+'"/>'; });
  leaves.forEach((L, j) => { const b = root!==null && L.x.status==='ok' && L.x.d===root && gval(L.g)===root; s += '<line x1="'+gx[L.g]+'" y1="132" x2="'+lx(j)+'" y2="178" stroke="'+(b?C.ink:C.line)+'" stroke-width="'+(b?2:1)+'"/>'; });
  s += node(W/2, 8, nm(spec.title), root, true);
  gn.forEach(g => s += node(gx[g], 94, g, gval(g), root!==null && gval(g)===root));
  leaves.forEach((L, j) => s += node(lx(j), 178, nm(L.x.p.name), L.x.status==='ok'?L.x.d:null, root!==null && L.x.status==='ok' && L.x.d===root));
  return s + '</svg>';
}

// ---------------- step 3 ----------------
function renderVer(){
  if (!spec.lock) { $('#v-ver').innerHTML = '<h2>'+t('s3t')+'</h2><div class="lockbar"><div>'+t('noLock')+'</div></div>'; return; }
  const r = HN.evaluate(engineSpec(spec), inputs);
  LASTREP = {spec: body(spec), lock: spec.lock, inputs: JSON.parse(JSON.stringify(inputs)), evidence: JSON.parse(JSON.stringify(EV)), contractor: META.contractor||''};
  LASTREP.reportFingerprint = HN.sha256(HN.canon(LASTREP));
  LASTR = r; LASTOK = fingerprint(spec)===spec.lock.fingerprint && r.n===r.N;
  $('#v-ver').innerHTML = '<h2>'+t('s3t')+'</h2><p class="lead">'+t('verLead')+'</p>'+exBanner()+lockBar()+
    '<div class="sumbox"><b>'+t('verSum')+'</b><div class="mono" style="font-size:22px;margin-top:4px">A = '+(r.H===null?'—':fmt(r.H))+' · '+esc(t('V_'+r.verdict))+'</div><div class="hint">'+t('readN', r.n, r.N, esc(spec.version), spec.lock.fingerprint.slice(0,12))+'</div></div>'+
    '<div id="verOut"></div><div id="decOut"></div>';
  if (!LASTOK) $('#verOut').innerHTML = '<div class="err">'+(r.n<r.N ? t('verIncomplete', r.N-r.n) : t('altered'))+'</div>';
  renderDecision();
}
let LASTREP = null, LASTOK = false, LASTR = null;
function renderDecision(){
  const rep = LASTREP, r = LASTR; if (!rep) return;
  const ev = rep.evidence || {};
  let h = '<h3>'+t('evT')+(rep.contractor?' · '+esc(rep.contractor):'')+'</h3><div class="evlist">';
  r.rows.forEach(x => { const v = (rep.inputs||{})[x.p.id] || {}, e = ev[x.p.id] || {};
    const files = (e.files||[]).map((f,k) => { const okf = f.data ? HN.sha256(Uint8Array.from(atob(f.data), c => c.charCodeAt(0)))===f.sha : null;
      return '<li>📄 '+esc(f.name)+' · <span class="mono">'+f.sha.slice(0,10)+'…</span> '+(okf===null?'<span class="mut">'+t('fileNoData')+'</span>':okf?'<span class="acc">✓ '+t('fileOk')+'</span>':'<span class="rej">✗ '+t('fileBad')+'</span>')+(f.data?' <button class="btn small" data-dl="'+x.p.id+'" data-k="'+k+'">'+t('fileOpen')+'</button>':'')+'</li>'; }).join('');
    h += '<div class="item"><b>'+esc(nm(x.p.name))+'</b> · '+t('valL')+': <span class="mono">'+esc(nf(v.value))+(v.u!==undefined&&v.u!==''?' ± '+esc(nf(v.u)):'')+esc(U(x.p))+'</span> → <span class="mono '+(x.d<0?'rej':'acc')+'">'+(x.status==='ok'?fmt(x.d):'–')+'</span> — '+word(x)+
      (v.ev?'<div class="hint">'+t('evRef')+': '+esc(v.ev)+'</div>':'')+(e.calc?'<div style="margin-top:4px;white-space:pre-wrap">'+esc(e.calc)+'</div>':'')+(files?'<ul class="files">'+files+'</ul>':(!e.calc&&!v.ev?'<div class="hint">'+t('evNone')+'</div>':''))+'</div>'; });
  h += '</div>';
  if (!LASTOK) { $('#decOut').innerHTML = h; return; }
  const rec = t('V_'+r.verdict)+' ('+fmt(r.H)+')';
  const opt = (k,lab) => '<label class="opt"><input type="radio" name="dec" value="'+k+'">'+t(lab)+'</label>';
  h += '<div class="decide"><h3>'+t('decT')+'</h3><div class="hint" style="margin:0">'+t('sysRec', rec)+'</div><div class="opts">'+opt('ACCEPT','decAcc')+opt('CONDITIONAL','decCond')+opt('REJECT','decRej')+'</div>'+
    '<div class="grid g2"><div><label>'+t('decNote')+'</label><textarea id="decNote" rows="3"></textarea></div><div><label>'+t('decBy')+'</label><input id="decBy"></div></div>'+
    '<div id="decMsg" class="err"></div><div class="row"><button class="btn primary" id="bDec">'+t('decSave')+'</button></div><div id="decRes"></div></div>';
  $('#decOut').innerHTML = h; (CUR_DEC ? showDec(CUR_DEC) : 0);
  document.querySelectorAll('input[name=dec]').forEach(el => el.addEventListener('change', () => document.querySelectorAll('.decide label.opt').forEach(l => l.classList.toggle('on', l.querySelector('input').checked))));
  document.getElementById('bDec').addEventListener('click', () => {
    const sel = (document.querySelector('input[name=dec]:checked')||{}).value, note = $('#decNote').value.trim(), by = $('#decBy').value.trim();
    if (!sel) { $('#decMsg').textContent = t('decNeed'); return; }
    const differs = (sel==='ACCEPT' && r.verdict!=='ACCEPT') || (sel==='REJECT' && r.verdict==='ACCEPT') || (sel!=='REJECT' && r.H!==null && r.H<0);
    if (differs && !note) { $('#decMsg').textContent = t('decDiff'); return; }
    $('#decMsg').textContent = '';
    const dec = {kind:'ozkul-decision', createdAt:new Date().toISOString(), decision:sel, note, approvedBy:by, systemVerdict:r.verdict, A:r.H, specFingerprint:rep.lock.fingerprint, reportFingerprint:rep.reportFingerprint, contractor:rep.contractor||''};
    dec.decisionFingerprint = HN.sha256(HN.canon(dec));
    CUR_DEC = dec; try { sessionStorage.setItem('odn.dec', JSON.stringify(dec)); } catch(e){}
    showDec(dec);
  });
}
let CUR_DEC = null; try { CUR_DEC = JSON.parse(sessionStorage.getItem('odn.dec')||'null'); } catch(e){}
function showDec(dec){ const el = document.getElementById('decRes'); if (!el) return; const sel = dec.decision;
  const lab = t(sel==='ACCEPT'?'decAcc':sel==='REJECT'?'decRej':'decCond');
  el.innerHTML = '<div class="bigverdict '+(sel==='REJECT'?'rej':'acc')+'">'+esc(lab)+'</div><div class="hint">'+t('decDone', dec.decisionFingerprint.slice(0,16)+'…')+(dec.approvedBy?' · '+esc(dec.approvedBy):'')+' · '+new Date(dec.createdAt).toLocaleString(LANG==='tr'?'tr-TR':'en-GB')+'</div><div class="hint">'+t('decSession')+'</div>'; }
function bindDl(rep){ document.querySelectorAll('[data-dl]').forEach(el => el.addEventListener('click', () => { const f = rep.evidence[el.dataset.dl].files[+el.dataset.k];
  const a = document.createElement('a'); a.href = 'data:'+(f.type||'application/octet-stream')+';base64,'+f.data; a.download = f.name; document.body.appendChild(a); a.click(); a.remove(); })); }
function verify(rep){
  const out = []; let all = true; const add = (ok, txt) => { all = all && ok; out.push('<li><b class="'+(ok?'acc':'rej')+'">'+t(ok?'PASS':'FAIL')+'</b><span>'+txt+'</span></li>'); };
  if (!rep || !/report$/.test(rep.kind||'') || !rep.spec) { $('#verOut').innerHTML = '<ul class="check"><li><b class="rej">'+t('FAIL')+'</b><span>'+t('c_notRep')+'</span></li></ul>'; return; }
  const sOk = rep.lock && HN.sha256(HN.canon(rep.spec))===rep.lock.fingerprint; add(sOk, t(sOk?'c_spec':'c_specBad'));
  const copy = JSON.parse(JSON.stringify(rep)), stated = copy.reportFingerprint; delete copy.reportFingerprint;
  const rOk = HN.sha256(HN.canon(copy))===stated; add(rOk, t(rOk?'c_rep':'c_repBad'));
  const s = Object.assign({}, rep.spec, {alpha: rep.spec.coverage==='alpha' ? rep.spec.alpha : null});
  const ve = HN.validateSpec(s); add(!ve.length, ve.length ? t('c_rulesBad', esc(ve.join(' '))) : t('c_rules'));
  const r = HN.evaluate(s, rep.inputs||{}), R = rep.result||{};
  add(r.H===R.H, t('c_H', fmt(r.H), fmt(R.H)));
  add(r.verdict===R.verdict, t('c_V', t('V_'+r.verdict), esc(R.verdict?t('V_'+R.verdict):'–')));
  add(r.n===R.n && r.N===R.N, t('c_n', r.n+'/'+r.N, R.n+'/'+R.N));
  const mis = r.rows.filter(x => { const st = (R.scores||[]).find(y => y.id===x.p.id); return !st || (st.d===null?null:st.d)!==(x.d===undefined?null:x.d); });
  add(!mis.length, mis.length ? t('c_scBad', esc(mis.map(x => nm(x.p.name)).join(', '))) : t('c_sc', r.rows.length));
  LASTREP = rep; LASTOK = all; LASTR = r;
  $('#verOut').innerHTML = '<div class="bigverdict '+(all?'acc':'rej')+'">'+(all ? t('verOK', t('V_'+r.verdict)+' ('+fmt(r.H)+')') : t('verBad'))+'</div><div class="hint">'+esc(nm(rep.spec.title))+' · '+t('version')+' '+esc(rep.spec.version)+' · '+esc(new Date(rep.createdAt).toLocaleString())+'</div><ul class="check">'+out.join('')+'</ul>';
  renderDecision();
}

// ---------------- scientific section ----------------
function scienceHTML(){
  const tr = LANG==='tr';
  const blocks = tr ? [
   ['1. Sabit anlamlı, işaretli ölçek','Her koşul −1 ile +1 arasında bir puana çevrilir. 0 her zaman şartnamedeki sınırdır. Bu yüzden işaret her alanda aynı anlamı taşır: A ≥ 0 bütün zorunlu sınırların sağlandığını, A &lt; 0 en az birinin aşıldığını gösterir. (A + 1)/2 dönüşümüyle aynı bilgi 0–1 aralığına da taşınabilir. İşaretli ölçeğin tercih edilmesinin nedeni anlamdır: uygunluk işaretten, derece büyüklükten okunur ve ayrıca bir eşik değerini hatırlamak gerekmez.'],
   ['Eksi tarafın katma değeri','Eksi değer aşımın derinliğini, yani sınırdan kabul edilemez noktaya giden yolun ne kadarının geçildiğini ölçer. Bu bilgi uygunsuzluk ortaya çıktıktan sonra verilen kararları besler: sapma onayı (şartlı kabul), yeniden işleme önceliği, hiçbir teklifin uymadığı ihalede pazarlık adayı, zaman içinde kötüleşmenin izlenmesi ve aşımın derinliğine bağlı yaptırımlar. İstenirlik indeksinde sınır dışındaki her değer 0 olduğu için bu ayrım kaybolur.'],
   ['2. Üç çapa ve yön','Şartname sahibi her koşul için yönü (büyük iyi, küçük iyi, aralık, evet/hayır) ve üç çapayı verir: S (−1, kabul edilemez), L (0, sınır), B (+1, doyum). Çapaların sırası beyan edilen yönle uyuşmalıdır, aksi hâlde şartname kilitlenemez.'],
   ['3. Kötü taraf değeri','Ölçülen değer belirsizliği kadar sınıra doğru kaydırılır:<div class="f">x* = x − k·u·sgn(B − L)</div>Çok koşullu işlerde toplam riski α ile sınırlamak için<div class="f">k<sub>N</sub> = Φ<sup>−1</sup>((1 − α)<sup>1/N</sup>)</div>kullanılır.'],
   ['4. Koşul puanı','<div class="f">d = (x* − L)/(B − L)  eğer bu ≥ 0 ise,  aksi hâlde  d = (x* − L)/(L − S)</div>Puan [−1, +1] aralığına kırpılır ve iki basamağa aşağı yuvarlanır. Sınır değeri “hariç” işaretlenmişse tam sınıra eşit değer −0,01 alır (en küçük ihlal adımı). Aralık koşullarında iki tarafın küçüğü, log ölçekte değerlerin logaritması kullanılır.'],
   ['5. Karar sayısı','<div class="f">A = (1 − β)·m + β·Σ w<sub>j</sub>d<sub>j</sub>   (m ≥ 0)</div><div class="f">A = min{ (1 − β)·m + β·Σ w<sub>j</sub>d<sub>j</sub> , m·(1 − β·max(0, Σ w<sub>j</sub>d<sub>j</sub>)) }   (m &lt; 0)</div>m en zayıf zorunlu koşulun puanı, w önem ağırlıkları (toplamı 1), β diğer koşulların etkisidir (0–0,75). Zorunlu bir koşul −1 ise A = −1 (veto). İşareti yalnızca zorunlu koşullar belirler (Teorem 2). β = 0 iken A = m olur ve yalnızca en küçük değer kuralı kalır; bu kural simetri, aynı puanların özetinin o puan olması, monotonluk ve şişirilemezlik (koşul eklemek sonucu yükseltemez) ilkelerini aynı anda sağlayan tek fonksiyon en küçük değerdir (makale, Teorem 1). Ağırlıklı ortalama bu son ilkeyi bozar.'],
   ['6. Karar kuralı','n &lt; N ise onaylanamaz. A ≥ τ<sub>kabul</sub> ise kabul, A ≤ τ<sub>ret</sub> ise ret, arada ise karar vericiye kalır. τ<sub>kabul</sub> ≥ 0 zorunludur: bir sınır ihlali hiçbir eşikle otomatik kabule dönüşemez. τ<sub>ret</sub> &lt; 0 seçilirse sınırı hafifçe aşan iş karar vericiye kalır. Kabul edilirse bu bir istisna onayıdır.'],
   ['7. Gösterim','Ortada A; sağ üstte τ<sub>kabul</sub>, sağ altta τ<sub>ret</sub>; sol üstte n/N; sol altta sürüm ve şartnamenin parmak izi. Boş bırakılan köşe "tanımlanmamış" demektir.'],
   ['8. Kilit ve doğrulama','Şartname kanonik biçimde yazılır ve SHA-256 parmak izi alınır. Rapor, şartnameyi, girdileri, sonucu ve kendi parmak izini içerir. Doğrulama her şeyi yeniden hesaplar. Parmak izi değişikliği tespit eder, kimin yazdığını kanıtlamaz. Resmî kullanım için dijital imza gerekir.']
  ] : [
   ['1. Signed, fixed-meaning scale','Every requirement is mapped to a score between −1 and +1, and 0 is always the limit in the specification. The sign therefore means the same in every domain: A ≥ 0 means every mandatory limit is met, A &lt; 0 means at least one is exceeded. (A + 1)/2 maps the same information onto 0–1; the signed form is chosen for meaning: compliance is read from the sign and degree from the size, with no reference value to remember.'],
   ['What the minus side adds','A negative value measures the depth of a violation: how much of the way from the limit to the unacceptable point has been covered. This supports decisions taken after non-compliance is known: concessions, rework priority, renegotiation when no offer complies, monitoring of worsening trends and penalties proportional to the violation. Desirability indices set every out-of-range value to 0 and lose this distinction.'],
   ['2. Three anchors and direction','For each requirement the owner states its direction (higher better, lower better, range, yes/no) and three anchors: S (−1, unacceptable), L (0, limit), B (+1, saturation). The anchor order must agree with the declared direction, otherwise the specification cannot be locked.'],
   ['3. Worst-side value','The measured value is moved towards the limit by its uncertainty:<div class="f">x* = x − k·u·sgn(B − L)</div>To keep the total risk over N requirements at α,<div class="f">k<sub>N</sub> = Φ<sup>−1</sup>((1 − α)<sup>1/N</sup>)</div>is used.'],
   ['4. Requirement score','<div class="f">d = (x* − L)/(B − L)  if this is ≥ 0,  otherwise  d = (x* − L)/(L − S)</div>Clipped to [−1, +1] and rounded down to two decimals. If a limit is marked “excluded”, a value exactly at it scores −0.01 (the smallest violation step). Ranges take the smaller side score; log scales use logarithms of values and anchors.'],
   ['5. Decision number','<div class="f">A = (1 − β)·m + β·Σ w<sub>j</sub>d<sub>j</sub>   (m ≥ 0)</div><div class="f">A = min{ (1 − β)·m + β·Σ w<sub>j</sub>d<sub>j</sub> , m·(1 − β·max(0, Σ w<sub>j</sub>d<sub>j</sub>)) }   (m &lt; 0)</div>m is the weakest mandatory score, w the importance weights (sum 1), β the effect of the other requirements (0–0.75). A mandatory score of −1 gives A = −1 (veto). Only mandatory requirements set the sign (Theorem 2). With β = 0, A = m and the minimum is the only function that is symmetric, idempotent, monotone and non-inflatable, i.e. adding requirements can never raise the result (paper, Theorem 1). A weighted mean breaks the last property.'],
   ['6. Decision rule','If n &lt; N: not approvable. A ≥ τ<sub>acc</sub>: accept; A ≤ τ<sub>rej</sub>: reject; otherwise the decision-maker decides. τ<sub>acc</sub> ≥ 0 is mandatory, so no threshold can turn a violated limit into an automatic acceptance. With τ<sub>rej</sub> &lt; 0, work slightly exceeding a limit is left to the decision-maker; accepting it is a concession.'],
   ['7. Notation','Centre: A; top right: τ<sub>acc</sub>; bottom right: τ<sub>rej</sub>; top left: n/N; bottom left: version and specification fingerprint. An empty corner means "not defined".'],
   ['8. Lock and verification','The specification is serialised canonically and fingerprinted with SHA-256. The report contains the specification, inputs, result and its own fingerprint; verification recomputes everything. The fingerprint detects changes; it does not prove authorship. For contractual use, sign it digitally.']
  ];
  return '<div class="badge" style="margin-bottom:14px">'+t('sciBadge')+'</div><h2>'+t('sciT')+'</h2><p class="lead">'+t('sciLead')+'</p><div class="sci">'+blocks.map(b => '<div><h3>'+b[0]+'</h3><p>'+b[1]+'</p></div>').join('')+'</div>';
}

paintStatic(); render();
})();
